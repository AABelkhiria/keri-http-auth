[package]
name = "keri-http-auth-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
keri-http-auth = { path = ".." }
keri-cesr = { version = "0.1.0", features = ["crypto"] }
libfuzzer-sys = "0.4.13"

[[bin]]
name = "ending"
path = "fuzz_targets/ending.rs"
test = false
doc = false
bench = false

[[bin]]
name = "authing"
path = "fuzz_targets/authing.rs"
test = false
doc = false
bench = false
