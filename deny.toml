# cargo-deny policy for keri-http-auth.

[graph]
all-features = true

[licenses]
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
# `(MIT OR Apache-2.0) AND NCSA` exists only in the fuzz workspace's libFuzzer harness, which is development tooling and
# never linked into the SDK.
crate = "libfuzzer-sys"
allow = ["NCSA"]

[advisories]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
