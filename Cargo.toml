[package]
name = "keri-http-auth"
version = "0.0.0"
description = "KERI HTTP message signatures and request authentication"
edition = "2024"
rust-version = "1.97"
publish = false
license = "Apache-2.0 OR MIT"
keywords = ["keri", "keria", "signify", "http", "signature"]
categories = ["authentication", "web-programming"]

[dependencies]
keri-cesr = { version = "0.1.0", features = ["crypto"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

[[bench]]
name = "ending"
harness = false

[[bench]]
name = "authing"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
